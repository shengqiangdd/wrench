services:
  wrench:
    container_name: wrench
    image: ghcr.io/shengqiangdd/wrench:latest
    network_mode: host
    volumes:
      - wrench-data:/data
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: /data/wrench.db
      JWT_SECRET: "${JWT_SECRET:?请设置 JWT_SECRET 环境变量}"
      # 门开关：off = 访问者零输入直进（不设口令）；on（默认）需要在下面给出口令
      WRENCH_REQUIRE_AUTH: "${WRENCH_REQUIRE_AUTH:-on}"
      # 入口口令由部署侧提供；留空且门开着时受保护接口一律 503（没有「网页首次设置」）
      WRENCH_AUTH_PASSWORD: "${WRENCH_AUTH_PASSWORD:-}"
      FRONTEND_DIST: /app/working/workspaces/default/wrench/frontend/dist
      PLUGINS_DIR: /app/working/workspaces/default/wrench/plugins

volumes:
  wrench-data:
