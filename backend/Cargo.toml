[package]
name = "wrench-backend"
version = "0.1.0"
edition = "2024"
description = "Wrench Backend - Rust server management platform"

# ── 编译策略：控制 target/ 体积（历史峰值 21GB）──
# 详细配置见 .cargo/config.toml，此处仅覆盖 profile 参数。
# 原则：关闭增量编译 + strip 符号 + 最小 debug info

[profile.dev]
incremental = false
strip = "symbols"
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "symbols"
panic = "abort"
incremental = false

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "json", "macros", "tokio"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "request-id", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# IDs
uuid = { version = "1.23", features = ["v4", "serde"] }

# Config
dotenvy = "0.15"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Crypto
aes-gcm = { version = "0.11", features = ["getrandom"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.13"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.10"

# SSH client
russh = "0.62"
russh-sftp = "2.3"

# Docker
bollard = "0.21"

# Validation
regex = "1.13"

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.13", features = ["json", "stream"] }

# Email (SMTP)
lettre = { version = "0.11", features = ["tokio1-native-tls", "smtp-transport", "builder"] }

# Database
rusqlite = { version = "0.40", features = ["bundled", "backup"] }

# Cron expression parsing
cron = "0.15"

# Auth
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# Helpers
bytes = "1.12"
futures-util = "0.3"
dashmap = "6"
parking_lot = "0.12"
dirs = "5"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
# Allow struct update syntax with Default::default() — cleaner than listing every field
needless_update = "allow"
