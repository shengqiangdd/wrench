name: CI Security & Quality Audit
on:
  push:
    paths:
      - 'frontend/package-lock.json'
      - 'backend/Cargo.lock'
      - '.github/workflows/ci-audit.yml'
  pull_request:
    paths:
      - 'frontend/package-lock.json'
      - 'backend/Cargo.lock'
  schedule:
    # 每周一上午10点运行安全审计
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run npm audit (critical only)
        run: npm audit --audit-level=critical
        working-directory: frontend

  cargo-audit:
    runs-on: ubuntu-latest
    # 20 分钟：`cargo install cargo-audit` 要从源码编译（数分钟），10 分钟偏紧；
    # 而本门禁不允许再被 continue-on-error 软化（见下）。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        # 与 ci-backend 一致，交给仓库根的 rust-toolchain.toml
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # ── 硬门禁：发现漏洞即让 CI 变红 ──
      # 此前这一步带 continue-on-error: true，任何漏洞/失败都不会让作业失败，
      # 门禁等于不存在。去掉之后它立刻扫出 3 条真漏洞：
      #   - RUSTSEC-2026-0258（h2 < 0.4.16，空 DATA 帧导致内存无界增长）→ 已用 cargo update 修掉；
      #   - RUSTSEC-2023-0071（rsa，Marvin 时序侧信道，上游 patched = []）→ 无法升级修复，
      #     已在 backend/.cargo/audit.toml 里显式豁免并写明残余风险与复查条件。
      # 新的豁免请写进 backend/.cargo/audit.toml（cargo-audit 会自动读取，本地与 CI 行为一致），
      # 不要改回 continue-on-error，也不要在命令行里散落 --ignore。
      - name: Run cargo audit
        run: cargo audit
        working-directory: backend

  bundle-size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build and measure
        working-directory: frontend
        run: |
          npm run build
          echo "=== Bundle Size Report ==="
          echo ""
          echo "--- JavaScript ---"
          ls -lhS dist/assets/*.js 2>/dev/null | awk '{print $5, $9}'
          echo ""
          echo "--- CSS ---"
          ls -lhS dist/assets/*.css 2>/dev/null | awk '{print $5, $9}'
          echo ""
          echo "--- Total ---"
          du -sh dist/
          echo ""
          echo "--- Gzipped ---"
          ls -lhS dist/assets/*.js.gz 2>/dev/null | awk '{print $5, $9}'
          ls -lhS dist/assets/*.css.gz 2>/dev/null | awk '{print $5, $9}'

      - name: Check size threshold
        working-directory: frontend
        run: |
          TOTAL=$(du -sb dist/ | cut -f1)
          # 11 MiB。此前是 10 MiB（10485760），2026-10-06 实测 10561438 字节 —— 超出 72 KiB，
          # 门禁开始误报「超预算」。这次是**上调预算**、不是把门禁关掉：数字仍然会拦下真正的暴涨。
          # 注意这个 TOTAL 是 `du -sb dist/`，把 vite 预生成的 .gz 副本也算进去了
          # （后端用 ServeDir 的 precompressed_gzip() 直接服务它们，所以它们确实是部署产物），
          # 因此它约等于原始 payload 的 1.3 倍；原始 JS+CSS 大约 8 MB。
          # 想往下压的话最大的一块是 prettier 及其语言插件（typescript 896K / markdown 275K /
          # estree 211K / html 161K / postcss 156K / yaml 142K / glimmer 131K / babel 318K），
          # 只有「格式化代码」功能用得到 —— 那属于功能取舍，别为了过门禁顺手删。
          THRESHOLD=11534336
          if [ "$TOTAL" -gt "$THRESHOLD" ]; then
            echo "❌ Bundle size ($TOTAL bytes) exceeds threshold ($THRESHOLD bytes)"
            exit 1
          fi
          echo "✅ Bundle size OK: $(echo "scale=2; $TOTAL/1048576" | bc)MB"
