name: CI E2E Tests
on:
  pull_request:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Test filter (e.g. "chromium" or "mobile")'
        required: false
        default: ''

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start isolated SSH/SFTP stack
        run: docker compose -f docker-compose.e2e.yml up -d --build

      - name: Wait for Wrench health
        run: |
          for i in $(seq 1 45); do
            curl --fail --silent --show-error http://localhost:3001/api/health && exit 0
            sleep 2
          done
          docker compose -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.e2e.yml logs --no-color
          exit 1

      - name: Run real SSH/SFTP E2E
        run: |
          FILTER="${{ github.event.inputs.test_filter }}"
          if [ -n "$FILTER" ]; then
            npx playwright test --project="$FILTER"
          else
            npx playwright test --project=chromium
          fi
        working-directory: frontend
        env:
          BASE_URL: http://localhost:3001
          WRENCH_E2E_SSH_HOST: 172.30.0.10
          WRENCH_E2E_SSH_USER: e2e
          WRENCH_E2E_SSH_PASSWORD: e2e-password
          WRENCH_E2E_SSH_PORT: '22'

      - name: Collect SSH/SFTP stack diagnostics
        if: failure()
        run: |
          docker compose -f docker-compose.e2e.yml ps
          docker compose -f docker-compose.e2e.yml logs --no-color

      - name: Stop isolated SSH/SFTP stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
