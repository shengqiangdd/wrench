name: CI Secrets Scan
# 明文凭据扫描：把「密钥/令牌/口令写进仓库」挡在合并之前。
#
# 背景（真实事件，不是假想）：本仓库此前进过 `deploy*.py`，里面写着服务器 IP +
# 用户名 + 明文口令，而仓库是 **public** 的。文件后来删了，但删除只影响 HEAD、
# 不影响历史 —— `git log -p` 至今仍能翻出来。这类东西一旦 push 就不可撤回，
# 所以门禁必须开在 push 之前。
on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    # 每周一 09:00 扫一遍全历史对象（比 diff 扫重，但不适合每次 push 都跑）
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  scan-tree:
    name: 扫描已跟踪文件
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Scan tracked files
        run: bash tools/check-secrets.sh

  scan-history:
    name: 扫描全历史对象
    # 只在定时/手动时跑：全历史 blob 逐个过一遍，比扫工作区慢得多
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan every blob in history
        # 这里只扫「高信号模式」（私钥/令牌）。历史里已确认存在过一次服务器明文口令，
        # 那类具体串不写进仓库（写进去等于再泄露一次），靠本机 denylist 与轮换处理，
        # 见 docs/DEPLOY.md 的凭据章节。
        run: bash tools/check-secrets.sh --all-history-objects
