name: CI Backend
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  rust-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # 不再写 toolchain: stable：交给仓库根的 rust-toolchain.toml（含 rustfmt/clippy 组件）。
      # 钉死版本之前，Rust 每发一版新增默认告警，CI 就会在自己没改任何代码的情况下变红。
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-targets: false
          shared-key: clippy-v3
      - run: cargo fmt --all --check
        working-directory: backend
      - run: cargo check --locked
        working-directory: backend
      - run: cargo clippy --all-targets --locked -- -D warnings -A clippy::needless_update -A clippy::field_reassign_with_default
        working-directory: backend
      - run: cargo test --all-targets --locked
        working-directory: backend
