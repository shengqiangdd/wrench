# Production image deployment. Pin WRENCH_IMAGE to a digest for repeatable upgrades/rollback.
# Public access is intentional here: WRENCH_REQUIRE_AUTH remains off.
services:
  wrench:
    image: "${WRENCH_IMAGE:-ghcr.io/shengqiangdd/wrench:latest}"
    container_name: wrench
    ports:
      - "3001:3001"
    volumes:
      - wrench-data:/data
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: /data/wrench.db
      JWT_SECRET: "${JWT_SECRET:-}"
      WRENCH_VERSION: "${WRENCH_VERSION:-}"
      WRENCH_REQUIRE_AUTH: "off"
      WRENCH_AUTH_PASSWORD: ""
      WRENCH_EGRESS_ALLOW: "192.168.2.0/24:22"
      # JSON profiles approved for browser-space SSH egress selection.
      # Supply WRENCH_EGRESS_PROFILES in the shell or .env before running Compose.
      WRENCH_EGRESS_PROFILES: "${WRENCH_EGRESS_PROFILES:-[]}"
      WRENCH_EGRESS_STRICT: "${WRENCH_EGRESS_STRICT:-0}"
      WRENCH_TRUSTED_PROXIES: "${WRENCH_TRUSTED_PROXIES:-}"
      WRENCH_CSP: "${WRENCH_CSP:-}"
      WRENCH_MAX_SESSIONS: "${WRENCH_MAX_SESSIONS:-32}"
      WRENCH_MAX_SESSIONS_PER_SPACE: "${WRENCH_MAX_SESSIONS_PER_SPACE:-8}"
      WRENCH_MAX_WS_CONNECTIONS: "${WRENCH_MAX_WS_CONNECTIONS:-128}"
      WRENCH_HSTS: "${WRENCH_HSTS:-}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

volumes:
  wrench-data:
