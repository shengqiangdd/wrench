services:
  wrench:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_HASH: "${BUILD_HASH:-}"
    image: ghcr.io/shengqiangdd/wrench:latest
    container_name: wrench
    ports:
      - "3001:3001"
    volumes:
      - wrench-data:/data
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Optional source/image identifier exposed by /api/health.
      WRENCH_VERSION: "${WRENCH_VERSION:-}"
      DATABASE_URL: /data/wrench.db
      # JWT_SECRET: 留空则 entrypoint 自动生成随机密钥（重启后失效，生产环境请显式设置）
      JWT_SECRET: "${JWT_SECRET:-}"
      # WRENCH_REQUIRE_AUTH: 门开关（默认 on）。设为 off 则访客零输入直进（不设入口口令）。
      WRENCH_REQUIRE_AUTH: "off"
      # WRENCH_AUTH_PASSWORD: 入口口令（可选，**由部署侧提供**）。
      # 留空且门开着（默认）时，受保护接口一律 503（fail-closed）——
      # 不会让使用者去网页上自己设口令：要么在这里给口令，要么把门关掉（上一行）。
      WRENCH_AUTH_PASSWORD: ""
      # WRENCH_EGRESS_ALLOW: **这台机器允许主动连到哪里**（逗号分隔的 IP[:端口] / CIDR[:端口]）。
      # 留空 = 内网/环回/链路本地/云元数据地址一律拒绝（公网目标仍可连）。
      # 例：WRENCH_EGRESS_ALLOW=192.168.1.5:22,192.168.1.6:22
      # 注意：这个列表越窄越安全——每个条目都是「任何人打开网页后可以用来发起连接的目标」。
      # 留空即可动态连接公网 SSH 主机；私网/环回/元数据地址仍由后端阻断。
      # 需要内网主机时再显式填写精确 IP[:端口] 或窄 CIDR[:端口]。
      WRENCH_EGRESS_ALLOW: "192.168.2.0/24:22"
      # JSON profiles approved for browser-space SSH egress selection.
      # Example shell/.env value: [{"id":"fnas-lan","label":"FNOS 内网","source_ip":"192.168.2.9"}]
      WRENCH_EGRESS_PROFILES: "${WRENCH_EGRESS_PROFILES:-[]}"
      # WRENCH_EGRESS_STRICT: 置 1 时连公网目标也必须写在白名单里（只管理固定几台机时更严）
      WRENCH_EGRESS_STRICT: "${WRENCH_EGRESS_STRICT:-0}"
      # WRENCH_TRUSTED_PROXIES: 反向代理的地址/网段（逗号分隔 IP/CIDR）。
      # 挂了 HTTPS 反代却不设置它 → 登录限流会退化成全局共享配额、审计日志只记代理 IP。
      # 留空 = 完全不信任 X-Forwarded-For / X-Real-IP（对端伪造无效）。
      # 例：WRENCH_TRUSTED_PROXIES=172.17.0.1,10.0.0.0/8
      WRENCH_TRUSTED_PROXIES: "${WRENCH_TRUSTED_PROXIES:-}"
      # WRENCH_CSP: strict = 去掉 CSP 的 'unsafe-eval'（不使用插件时更严）；off = 关闭 CSP（不建议）
      WRENCH_CSP: "${WRENCH_CSP:-}"
      # WRENCH_MAX_SESSIONS: 全实例**同时保活**的 SSH 连接上限（默认 32，0 = 不限）。
      # 门与出口白名单管「谁能连、能连到哪」，管不住「连多少」：门关着时换一个空间码
      # 就能绕开单空间额度，所以这里留一档不随身份变化的全局闸门。
      WRENCH_MAX_SESSIONS: "${WRENCH_MAX_SESSIONS:-32}"
      # WRENCH_MAX_SESSIONS_PER_SPACE: 单个访客（一个空间）同时保活的连接上限（默认 8，0 = 不限）。
      WRENCH_MAX_SESSIONS_PER_SPACE: "${WRENCH_MAX_SESSIONS_PER_SPACE:-8}"
      # WRENCH_MAX_WS_CONNECTIONS: 全实例同时打开的 WebSocket 连接上限（默认 128，0 = 不限）。
      # 终端/日志的长连接在「SSH 会话尚未建立」时也占资源，必须单独封顶。
      WRENCH_MAX_WS_CONNECTIONS: "${WRENCH_MAX_WS_CONNECTIONS:-128}"
      # WRENCH_HSTS: off = 不主动下发 HSTS（外层代理已下发时用）
      WRENCH_HSTS: "${WRENCH_HSTS:-}"
      # VAULT_KEY: "${VAULT_KEY:-}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wrench-data:
