services:
  wrench:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_HASH: "${BUILD_HASH:-}"
    image: ghcr.io/shengqiangdd/wrench:latest
    container_name: wrench
    ports:
      - "3001:3001"
    volumes:
      - wrench-data:/data
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: /data/wrench.db
      # JWT_SECRET: 留空则 entrypoint 自动生成随机密钥（重启后失效，生产环境请显式设置）
      JWT_SECRET: "${JWT_SECRET:-}"
      # WRENCH_AUTH_PASSWORD: 登录密码。留空则 entrypoint 自动生成随机密码并保存到 /data/.env
      # （查看：docker exec wrench sh -c 'grep WRENCH_AUTH_PASSWORD /data/.env'）
      WRENCH_AUTH_PASSWORD: "${WRENCH_AUTH_PASSWORD:-}"
      # VAULT_KEY: "${VAULT_KEY:-}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wrench-data:
